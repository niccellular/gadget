# Copy to local.properties (ignored by Git) and replace the paths below.
# Local ATAK CIV 5.8 SDK build; no TAK repository account is required.
sdk.dir=/path/to/android/sdk
sdk.path=/path/to/ATAK-CIV-5.8.0.3-SDK
takdev.plugin=/path/to/ATAK-CIV-5.8.0.3-SDK/atak-gradle-takdev.jar

# For a TAK artifact repository build, comment out sdk.path and takdev.plugin
# above, then uncomment and configure ALL three takrepo properties below.
# Defining takrepo.url selects repository mode, even if credentials are placeholders.
#takrepo.url=https://artifacts.tak.gov/artifactory/maven
#takrepo.user=<username>
#takrepo.password=<password>

# Optional fixed version code for bisecting builds.
#takStaticVersion=1001
